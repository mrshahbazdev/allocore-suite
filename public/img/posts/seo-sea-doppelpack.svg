<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a1f" />
      <stop offset="50%" stop-color="#181335" />
      <stop offset="100%" stop-color="#05030e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg3)" />

  <!-- Background Glow -->
  <circle cx="950" cy="300" r="260" fill="#8b5cf6" fill-opacity="0.2" filter="blur(60px)" />
  <circle cx="300" cy="480" r="180" fill="#f59e0b" fill-opacity="0.15" filter="blur(50px)" />

  <!-- Badge -->
  <rect x="80" y="70" width="220" height="38" rx="19" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5" />
  <circle cx="102" cy="89" r="4" fill="#f59e0b" />
  <text x="120" y="94" fill="#f59e0b" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="2">GROWTH GUIDE</text>

  <!-- Title -->
  <text x="80" y="175" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="44" font-weight="800">
    SEO und SEA im Doppelpack
  </text>
  <text x="80" y="235" fill="url(#goldGrad)" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700">
    Mit Google Ads Ihre organischen Rankings pushen
  </text>
  <text x="80" y="285" fill="#a5b4fc" font-family="Segoe UI, sans-serif" font-size="18">
    Wie Search Ads als Testlabor für Top-Suchmaschinen-Rankings fungieren.
  </text>

  <!-- Search Engine Mockup UI -->
  <g transform="translate(80, 350)">
    <rect width="680" height="200" rx="16" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5" />
    
    <!-- Search Bar -->
    <rect x="24" y="24" width="632" height="46" rx="23" fill="#0f0c29" stroke="#6366f1" stroke-width="1" />
    <circle cx="50" cy="47" r="8" fill="none" stroke="#818cf8" stroke-width="2" />
    <line x1="56" y1="53" x2="64" y2="61" stroke="#818cf8" stroke-width="2" />
    <text x="75" y="53" fill="#e0e7ff" font-family="Segoe UI, sans-serif" font-size="15">google search: best enterprise tools &amp; consulting</text>

    <!-- Search Result Item (Sponsored + Organic) -->
    <g transform="translate(24, 90)">
      <text x="0" y="20" fill="#f59e0b" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">GESPONSORT (SEA)</text>
      <text x="130" y="20" fill="#818cf8" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Allocore Suite - High Intent Conversion</text>
      <text x="0" y="45" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="13">A/B Testing von Titles &amp; Meta-Descriptions vor dem SEO-Rollout.</text>
    </g>

    <g transform="translate(24, 150)">
      <text x="0" y="20" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">ORGANISCH #1 (SEO)</text>
      <text x="150" y="20" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Allocore AuditPro - Platz 1 Rankings</text>
    </g>
  </g>

  <!-- Right Booster Card -->
  <g transform="translate(800, 350)">
    <rect width="320" height="200" rx="16" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="28" y="45" fill="#f59e0b" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">RANKING ACCELERATOR</text>
    <text x="28" y="90" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="36" font-weight="800">+120%</text>
    <text x="28" y="125" fill="#c7d2fe" font-family="Segoe UI, sans-serif" font-size="14">Traffic Velocity &amp; Brand Signals</text>
    <rect x="28" y="155" width="260" height="8" rx="4" fill="#312e81" />
    <rect x="28" y="155" width="220" height="8" rx="4" fill="url(#goldGrad)" />
  </g>
</svg>