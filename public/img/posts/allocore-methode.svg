<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="acc1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg1)" />

  <!-- Grid lines -->
  <g opacity="0.05" stroke="#fff" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126" /><line x1="0" y1="252" x2="1200" y2="252" /><line x1="0" y1="378" x2="1200" y2="378" /><line x1="0" y1="504" x2="1200" y2="504" />
    <line x1="240" y1="0" x2="240" y2="630" /><line x1="480" y1="0" x2="480" y2="630" /><line x1="720" y1="0" x2="720" y2="630" /><line x1="960" y1="0" x2="960" y2="630" />
  </g>

  <!-- Glowing Aura -->
  <circle cx="980" cy="220" r="220" fill="#6366f1" fill-opacity="0.2" filter="blur(60px)" />
  <circle cx="200" cy="450" r="180" fill="#38bdf8" fill-opacity="0.15" filter="blur(50px)" />

  <!-- Badge -->
  <rect x="80" y="70" width="220" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="102" cy="89" r="4" fill="#38bdf8" />
  <text x="120" y="94" fill="#38bdf8" font-family="Segoe UI, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="2">ALLOCORE METHODE</text>

  <!-- Title -->
  <text x="80" y="175" fill="#ffffff" font-family="Segoe UI, -apple-system, sans-serif" font-size="48" font-weight="800">
    Die Allocore-Methode
  </text>
  <text x="80" y="235" fill="url(#acc1)" font-family="Segoe UI, -apple-system, sans-serif" font-size="32" font-weight="700">
    5 Säulen für nachhaltiges Unternehmenswachstum
  </text>
  <text x="80" y="285" fill="#94a3b8" font-family="Segoe UI, -apple-system, sans-serif" font-size="18">
    Systematische Unternehmensanalyse &amp; datenbasierte Optimierungsstrategie.
  </text>

  <!-- 5 Pillar Cards -->
  <g transform="translate(80, 340)">
    <!-- Pillar 1 -->
    <g transform="translate(0, 0)">
      <rect width="190" height="200" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)" />
      <rect x="0" y="0" width="190" height="4" rx="2" fill="#38bdf8" />
      <text x="24" y="45" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">SÄULE 01</text>
      <text x="24" y="80" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">Revenue</text>
      <text x="24" y="112" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="13">Umsatz &amp; Pipeline</text>
      <path d="M 24 165 Q 60 140 100 155 T 166 130" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(210, 0)">
      <rect width="190" height="200" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)" />
      <rect x="0" y="0" width="190" height="4" rx="2" fill="#34d399" />
      <text x="24" y="45" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">SÄULE 02</text>
      <text x="24" y="80" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">Profit</text>
      <text x="24" y="112" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="13">Marge &amp; Cashflow</text>
      <path d="M 24 160 Q 60 170 110 140 T 166 120" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(420, 0)">
      <rect width="190" height="200" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)" />
      <rect x="0" y="0" width="190" height="4" rx="2" fill="#818cf8" />
      <text x="24" y="45" fill="#818cf8" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">SÄULE 03</text>
      <text x="24" y="80" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">Order</text>
      <text x="24" y="112" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="13">Prozesse &amp; SOPs</text>
      <path d="M 24 150 H 166" stroke="#818cf8" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round" />
    </g>

    <!-- Pillar 4 -->
    <g transform="translate(630, 0)">
      <rect width="190" height="200" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)" />
      <rect x="0" y="0" width="190" height="4" rx="2" fill="#fbbf24" />
      <text x="24" y="45" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">SÄULE 04</text>
      <text x="24" y="80" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">Influence</text>
      <text x="24" y="112" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="13">Marke &amp; Trust</text>
      <circle cx="140" cy="150" r="16" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-width="2.5" />
    </g>

    <!-- Pillar 5 -->
    <g transform="translate(840, 0)">
      <rect width="190" height="200" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)" />
      <rect x="0" y="0" width="190" height="4" rx="2" fill="#f43f5e" />
      <text x="24" y="45" fill="#f43f5e" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">SÄULE 05</text>
      <text x="24" y="80" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">Legacy</text>
      <text x="24" y="112" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="13">Unabhängigkeit</text>
      <polygon points="140,135 152,158 128,158" fill="#f43f5e" fill-opacity="0.8" />
    </g>
  </g>
</svg>