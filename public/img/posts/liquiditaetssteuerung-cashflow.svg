<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Background decorative glow circles -->
  <circle cx="200" cy="150" r="180" fill="#10b981" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="450" r="220" fill="#059669" opacity="0.15" filter="url(#glow)" />
  <circle cx="700" cy="200" r="150" fill="#f59e0b" opacity="0.08" filter="url(#glow)" />

  <!-- Grid overlay lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="480" x2="1200" y2="480" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(100, 100)">
    <!-- Badge -->
    <rect x="0" y="0" width="280" height="42" rx="21" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
    <text x="24" y="26" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">FINANZMANAGEMENT &amp; CASHFLOW</text>

    <!-- Main Title -->
    <text x="0" y="95" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900">
      <tspan x="0" dy="0">Liquiditätssteuerung &amp;</tspan>
      <tspan x="0" dy="54" fill="url(#emeraldGrad)">Cashflow-Optimierung</tspan>
      <tspan x="0" dy="54" fill="#94a3b8" font-size="34" font-weight="700">im Mittelstand</tspan>
    </text>

    <!-- Subtitle / Bullet Points -->
    <g transform="translate(0, 245)">
      <circle cx="10" cy="10" r="5" fill="#10b981" />
      <text x="28" y="15" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">Fixkosten senken &amp; Deckungsbeiträge maximieren</text>

      <circle cx="10" cy="45" r="5" fill="#10b981" />
      <text x="28" y="50" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">13-Wochen-Liquiditätsvorschau &amp; Runway-Sicherheit</text>

      <circle cx="10" cy="80" r="5" fill="#10b981" />
      <text x="28" y="85" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">Säule 2 des Allocore Reifegradmodells (Profit)</text>
    </g>

    <!-- Logo / Brand Footer -->
    <g transform="translate(0, 385)">
      <text x="0" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="2">ALLOCORE INSIGHTS</text>
    </g>
  </g>

  <!-- Right Visual Dashboard Card -->
  <g transform="translate(720, 110)">
    <!-- Glassmorphic Background Card -->
    <rect x="0" y="0" width="380" height="420" rx="24" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />

    <!-- Card Header -->
    <text x="32" y="45" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">Cashflow Runway Monitor</text>
    <text x="32" y="68" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Allocore CashCore Engine</text>

    <!-- Metric 1: Liquiditätsreserve -->
    <g transform="translate(32, 95)">
      <rect x="0" y="0" width="316" height="74" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
      <text x="18" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">LIQUIDITÄTSRESERVE (RUNWAY)</text>
      <text x="18" y="56" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">6.4 Monate</text>
      <text x="210" y="54" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">▲ +38%</text>
    </g>

    <!-- Metric 2: Deckungsbeitrag -->
    <g transform="translate(32, 185)">
      <rect x="0" y="0" width="316" height="74" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
      <text x="18" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">DECKUNGSBEITRAG II (Ø)</text>
      <text x="18" y="56" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">54.2 %</text>
      <text x="210" y="54" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">▲ +8.5%</text>
    </g>

    <!-- Visual Chart Bars -->
    <g transform="translate(32, 280)">
      <rect x="0" y="0" width="316" height="105" rx="14" fill="#022c22" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
      <text x="18" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">13-WOCHEN ROLLIERENDE PROGNOSE</text>
      
      <!-- Chart Columns -->
      <rect x="25" y="55" width="22" height="35" rx="4" fill="#10b981" fill-opacity="0.4" />
      <rect x="58" y="48" width="22" height="42" rx="4" fill="#10b981" fill-opacity="0.5" />
      <rect x="91" y="42" width="22" height="48" rx="4" fill="#10b981" fill-opacity="0.6" />
      <rect x="124" y="38" width="22" height="52" rx="4" fill="#10b981" fill-opacity="0.7" />
      <rect x="157" y="32" width="22" height="58" rx="4" fill="#10b981" fill-opacity="0.8" />
      <rect x="190" y="25" width="22" height="65" rx="4" fill="#34d399" />
      <rect x="223" y="20" width="22" height="70" rx="4" fill="#34d399" />
      <rect x="256" y="15" width="22" height="75" rx="4" fill="#6ee7b7" />
    </g>
  </g>
</svg>