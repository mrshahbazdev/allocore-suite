<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="seoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg2)" />

  <!-- Ambient lights -->
  <circle cx="850" cy="280" r="180" fill="#3b82f6" fill-opacity="0.25" filter="url(#glow)" />
  <circle cx="1050" cy="350" r="160" fill="#10b981" fill-opacity="0.2" filter="url(#glow)" />

  <!-- Badge -->
  <rect x="80" y="70" width="220" height="38" rx="19" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
  <circle cx="102" cy="89" r="4" fill="#06b6d4" />
  <text x="120" y="94" fill="#06b6d4" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="2">PERFORMANCE SEO &amp; SEA</text>

  <!-- Title -->
  <text x="80" y="175" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="46" font-weight="800">
    Synergie von SEO und SEA
  </text>
  <text x="80" y="235" fill="url(#seaGrad)" font-family="Segoe UI, sans-serif" font-size="32" font-weight="700">
    Wie Sie Daten-Silos aufbrechen &amp; Performance verdoppeln
  </text>
  <text x="80" y="285" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="18">
    Kombinierte Keyword-Strategien für maximale Sichtbarkeit bei minimalen Klickkosten.
  </text>

  <!-- Visual Diagram (Synergy Intersection) -->
  <g transform="translate(680, 260)">
    <!-- SEA Circle -->
    <circle cx="120" cy="150" r="130" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="2" />
    <text x="70" y="140" fill="#60a5fa" font-family="Segoe UI, sans-serif" font-size="22" font-weight="800">SEA</text>
    <text x="70" y="165" fill="#93c5fd" font-family="Segoe UI, sans-serif" font-size="13">Paid Ads &amp; Data</text>

    <!-- SEO Circle -->
    <circle cx="280" cy="150" r="130" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="2" />
    <text x="290" y="140" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="22" font-weight="800">SEO</text>
    <text x="290" y="165" fill="#a7f3d0" font-family="Segoe UI, sans-serif" font-size="13">Organic Growth</text>

    <!-- Center Intersection Badge -->
    <rect x="155" y="105" width="90" height="90" rx="16" fill="#1e1b4b" stroke="#a855f7" stroke-width="2" />
    <text x="200" y="145" text-anchor="middle" fill="#c084fc" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">2x</text>
    <text x="200" y="168" text-anchor="middle" fill="#e9d5ff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">SYNERGY</text>
  </g>

  <!-- Left Stats Highlights -->
  <g transform="translate(80, 360)">
    <rect width="260" height="170" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="24" y="45" fill="#60a5fa" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">DATEN-INTEGRATION</text>
    <text x="24" y="85" fill="#fff" font-family="Segoe UI, sans-serif" font-size="28" font-weight="800">+45%</text>
    <text x="24" y="115" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="14">Höhere Keyword-Coverage</text>
    <rect x="24" y="135" width="210" height="6" rx="3" fill="#334155" />
    <rect x="24" y="135" width="160" height="6" rx="3" fill="url(#seaGrad)" />
  </g>

  <g transform="translate(370, 360)">
    <rect width="260" height="170" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="24" y="45" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">CPC-EFFIZIENZ</text>
    <text x="24" y="85" fill="#fff" font-family="Segoe UI, sans-serif" font-size="28" font-weight="800">-30%</text>
    <text x="24" y="115" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="14">Geringere Akquisekosten</text>
    <rect x="24" y="135" width="210" height="6" rx="3" fill="#334155" />
    <rect x="24" y="135" width="180" height="6" rx="3" fill="url(#seoGrad)" />
  </g>
</svg>